# Default developer: GPT-6.1 Terra Extra High.
model = "gpt-6.1-terra"
model_reasoning_effort = "xhigh"

[agents]
enabled = true
max_concurrent_threads_per_session = 2
# Ordinary helpers use Terra; Sol handles design, important changes and review.
default_subagent_model = "gpt-6.1-terra"
default_subagent_reasoning_effort = "xhigh"
