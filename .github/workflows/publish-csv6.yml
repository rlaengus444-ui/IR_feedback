name: Publish reviewed S3 connection evaluation ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-reviewed-candidate:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 62393c9159a9523eb74aabbf6911383bd247ccf1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: rlaengus444-ui/IR_feedback
          github-token: ${{ github.token }}
          run-id: 40577487288
          name: slice-candidate-046895bdebcd7cd13ddfbaf0c5dfa9a46a0e4614
          path: ${{ runner.temp }}/verified-s3-candidate
      - name: Validate exact evidence and publish only the reviewed evaluation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python release_tools/publish_s3_candidate.py "$env:RUNNER_TEMP\verified-s3-candidate" 046895bdebcd7cd13ddfbaf0c5dfa9a46a0e4614 7372e0529fb0e54e9100eda1625184f76b13a8e81807621231e2d4c89645c584 docs/validation/s3-discovery-2026.10.28-review.json
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed S3 evaluation publication failed' }
