name: Deliver reviewed slice candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e9936ad6934b2efdbc73982fc33744e96375d55
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: slice-candidate-4e9936ad6934b2efdbc73982fc33744e96375d55
          run-id: 40549555449
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify exact reviewed bytes and candidate identity
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          import sys
          sys.path.insert(0,'release_tools')
          from verify_package import verify
          root=Path('candidate')
          record=json.loads((root/'candidate.json').read_text(encoding='utf-8-sig'))
          assert record['source_commit']=='4e9936ad6934b2efdbc73982fc33744e96375d55'
          digest=verify(root/'IRFeedback-2026.10.28-slice.2.zip','2026.10.28-slice.2')
          assert digest==record['zip_sha256']=='2c779dec24542d6b8ceb9fd3e85f7265a477f1720ea0be487314b5399a4b5dba'
          import zipfile
          with zipfile.ZipFile(root/'IRFeedback-2026.10.28-slice.2.zip') as archive:
              manual=archive.read('app/templates/IR_슬라이싱_수동계산.xlsx')
          assert hashlib.sha256(manual).hexdigest()=='7d870e35c7c288573bf5ab279ede6eaab8fe37633cd0afbcc2c389bcdd79c8b3'
          (root/'IR_manual_slice.xlsx').write_bytes(manual)
          (root/'SHA256.txt').write_text(digest+'  IRFeedback-2026.10.28-slice.2.zip\n7d870e35c7c288573bf5ab279ede6eaab8fe37633cd0afbcc2c389bcdd79c8b3  IR_manual_slice.xlsx\n')
          print('Exact reviewed ZIP verified:',digest)
          PY
      - name: Publish explicitly requested evaluation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > candidate/RELEASE-NOTES.md <<'EOF'
          다운로드된 UiaBridge.dll의 0x80131515 로딩 오류를 수정한 검증용 EXE ZIP입니다. 같은 오류를 Windows에서 재현하고, 차단 표시를 유지한 실제 검색·UIAutomation 초기화 및 9개 보호 시험을 통과했습니다.

          ZIP 전체를 새 폴더에 압축 해제한 뒤 IRFeedback.exe를 실행하세요. Python은 포함되어 있습니다.

          Windows 내장 Python 시험159/159, EXE 실행·정상 종료, 실제 PowerShell CSV 보호6개 시험, 파일 누락·해시 검사와 Sol Max 독립 코드 검토를 통과했습니다. 설정 JSON·수동 XLSX·Pillow와 라이선스를 포함합니다.

          실제 Microsoft Excel COM 연동은 미검증입니다. 제어 알고리즘의 최종 승인과 실제 장비 적용은 계속 보류합니다. 정식 배포 검증 완료로 표기하지 않습니다.

          소스: 4e9936ad6934b2efdbc73982fc33744e96375d55
          ZIP SHA-256: 2c779dec24542d6b8ceb9fd3e85f7265a477f1720ea0be487314b5399a4b5dba
          EOF
          gh release create 2026.10.28-slice.2 candidate/IRFeedback-2026.10.28-slice.2.zip candidate/SHA256.txt candidate/IR_manual_slice.xlsx --target 4e9936ad6934b2efdbc73982fc33744e96375d55 --draft --prerelease --latest=false --title 'IR 피드백 외부 모듈 2026.10.28-slice.2 · 검증용' --notes-file candidate/RELEASE-NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases" > candidate/published-releases.json
          python - <<'PY'
          import json
          from pathlib import Path
          releases=json.loads(Path('candidate/published-releases.json').read_text())
          release=next(r for r in releases if r['tag_name']=='2026.10.28-slice.2')
          assert release['target_commitish']=='4e9936ad6934b2efdbc73982fc33744e96375d55'
          assert release['draft'] and release['prerelease']
          asset=next(a for a in release['assets'] if a['name']=='IRFeedback-2026.10.28-slice.2.zip')
          assert asset['state']=='uploaded'
          assert asset['size']==Path('candidate/IRFeedback-2026.10.28-slice.2.zip').stat().st_size
          assert asset['digest']=='sha256:2c779dec24542d6b8ceb9fd3e85f7265a477f1720ea0be487314b5399a4b5dba'
          manual=next(a for a in release['assets'] if a['name']=='IR_manual_slice.xlsx')
          assert manual['digest']=='sha256:7d870e35c7c288573bf5ab279ede6eaab8fe37633cd0afbcc2c389bcdd79c8b3'
          print('Uploaded ZIP and manual workbook server digests verified')
          PY
          gh release edit 2026.10.28-slice.2 --draft=false --prerelease --latest=false
