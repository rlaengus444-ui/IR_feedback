name: Publish reviewed live slice evaluation ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-reviewed-candidate:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: 68612168b86e25b3ab74d9b06f00e1676f29fb3e
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          repository: rlaengus444-ui/IR_feedback
          github-token: ${{ github.token }}
          run-id: 40585593546
          name: slice-candidate-6bf031de98fb4e5dfa5cb7f0ea537f9a11037313
          path: ${{ runner.temp }}/verified-slice-candidate
      - name: Validate exact evidence and publish only the reviewed evaluation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python release_tools/publish_slice_candidate.py "$env:RUNNER_TEMP\verified-slice-candidate" 6bf031de98fb4e5dfa5cb7f0ea537f9a11037313 1ecdf0e214e0809621553b03680afd760179ce67a038663e19d62d65038087a4 docs/validation/slice-live-2026.10.28-review.json
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed live slice evaluation publication failed' }
