name: Publish exact reviewed job resume evaluation
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  deliver-reviewed-artifact:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          ref: a2b260654c7620eca87ea57dc7fa36d3c2c24a4d
          path: reviewed-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate immutable artifact and publish existing reviewed draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python release_tools/publish_job_resume.py "$env:GITHUB_WORKSPACE\reviewed-source"
          if ($LASTEXITCODE -ne 0) { throw 'Exact reviewed artifact delivery failed' }
