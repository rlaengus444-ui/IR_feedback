name: Validate and publish IR csv.6
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-upload:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete package and run Windows tests using packaged runtime
        shell: pwsh
        run: |
          $zip = "$env:GITHUB_WORKSPACE\dist\IRFeedback-2026.10.27-csv.6.zip"
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne '73DE84FF12C56203BEF756F50A54E9E66E34F8A0D7F02736D9226BC739A0B353') { throw 'ZIP hash mismatch' }
          py -3 release_tools/verify_package.py $zip
          if ($LASTEXITCODE -ne 0) { throw 'Incomplete package' }
          $dest = Join-Path $env:RUNNER_TEMP 'IRFeedback'
          Expand-Archive -Path $zip -DestinationPath $dest
          if ((Get-FileHash "$dest\app\workbook-replay.settings.json" -Algorithm SHA256).Hash -ne '3453C5F1911F484CED847505CE30C5F94367EB168F8F5402F5EC96AC31D3A8E6') { throw 'Default settings mismatch' }
          Copy-Item 'app\test_layer_charts.py','app\test_session.py','app\test_target_temperature.py','app\test_layer_algorithm.py','app\test_new_features.py' "$dest\app"
          Copy-Item 'app\input_example_validation.json','app\random80_validation.json' "$dest\app"
          Push-Location "$dest\app"
          & "$dest\runtime\python.exe" -m unittest -v test_layer_charts test_session test_target_temperature test_layer_algorithm test_new_features
          if ($LASTEXITCODE -ne 0) { throw 'Windows package tests failed' }
          Pop-Location
      - name: Upload verified ZIP to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload 2026.10.27-csv.6 'dist/IRFeedback-2026.10.27-csv.6.zip' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
