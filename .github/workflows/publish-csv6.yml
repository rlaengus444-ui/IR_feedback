name: Publish reviewed reconnect and CSV archive evaluation ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish-reviewed-candidate:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Preserve checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: be3796d960d5f5c5e586995e44bf1147dfefc95b
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact reviewed artifact by immutable API ID
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          repo = 'rlaengus444-ui/IR_feedback'
          artifact_id = 12909557635
          run_id = 40901581109
          source = '6ee48f34c39a18d290aab6391a587769ce913e96'
          expected = 'e2b62ec8a73bf647d54490dc1c4fef76ecf05075e6df6f7f1882da1ab9131fdd'
          endpoint = f'repos/{repo}/actions/artifacts/{artifact_id}'
          metadata = json.loads(subprocess.check_output(['gh', 'api', endpoint], timeout=30))
          assert metadata['id'] == artifact_id and metadata['name'] == 'slice-candidate-' + source
          assert metadata['expired'] is False and metadata['size_in_bytes'] == 34876787
          assert metadata['digest'] == 'sha256:' + expected
          assert metadata['workflow_run']['id'] == run_id and metadata['workflow_run']['head_sha'] == source
          assert metadata['workflow_run']['repository_id'] == 1434868115
          assert metadata['workflow_run']['head_repository_id'] == 1434868115
          archive_path = Path(os.environ['RUNNER_TEMP']) / 'verified-reconnect-evidence.zip'
          with archive_path.open('xb') as stream:
              subprocess.run(['gh', 'api', endpoint + '/zip'], stdout=stream, check=True, timeout=60)
          assert archive_path.stat().st_size == 34876787
          assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == expected
          output = Path(os.environ['RUNNER_TEMP']) / 'verified-reconnect-candidate'
          output.mkdir()
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              assert len(infos) <= 64
              assert sum(item.file_size for item in infos) <= 64 * 1024 * 1024
              seen = set()
              for item in infos:
                  name = item.filename
                  parts = name.rstrip('/').split('/')
                  assert name and not name.startswith('/') and '\\' not in name
                  assert all(p not in ('', '.', '..') and ':' not in p and not p.endswith((' ', '.')) for p in parts)
                  assert not (item.external_attr >> 16 & 0o170000 == 0o120000)
                  folded = name.rstrip('/').casefold()
                  assert folded not in seen
                  seen.add(folded)
              assert archive.testzip() is None
              archive.extractall(output)
          print('Verified exact artifact ID, provenance, archive digest and safe extraction.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Exact reviewed artifact download failed' }
      - name: Validate exact evidence and publish only the reviewed evaluation ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python release_tools/publish_auto_slice_candidate.py "$env:RUNNER_TEMP\verified-reconnect-candidate" 6ee48f34c39a18d290aab6391a587769ce913e96 148f3a3c71cc1c8b73565bb1c94726040a311038df7615353b21fdd8b71ae4ab docs/validation/auto-slice-2026.10.29-release-review.json
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed reconnect and CSV archive evaluation publication failed' }
