name: Validate connected slice candidate
on:
  workflow_dispatch:
  push:
    branches: ['work/slice-release-*']
permissions:
  contents: read
jobs:
  windows-candidate:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Preserve checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build candidate
        id: build
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\slice-candidate"
          New-Item -ItemType Directory -Force $out | Out-Null
          $base = 'dist/IRFeedback-2026.10.27-csv.6.zip'
          if ((Get-FileHash $base -Algorithm SHA256).Hash -ne 'FF216AACA807A47B44DE34F47194AFF88F28DD0F08A9874F330CDD8C67BE5E84') { throw 'Base ZIP hash mismatch' }
          $wheel = "$env:RUNNER_TEMP\pillow-13.0.0-cp314-cp314-win_amd64.whl"
          Invoke-WebRequest 'https://files.pythonhosted.org/packages/50/e2/7ad17747517e4c813dca78257d6bb593466f8231baf1384bc98d92745edb/pillow-13.0.0-cp314-cp314-win_amd64.whl' -OutFile $wheel
          if ((Get-FileHash $wheel -Algorithm SHA256).Hash -ne 'F7CBB7A64E7EC664775195E4F81923BC8A93D9451B963F844E59118F63147A7A') { throw 'Pillow wheel hash mismatch' }
          $zip = "$out\IRFeedback-2026.10.30-csv-wait.2.zip"
          python release_tools/build_slice_package.py $base $zip '2026.10.30-csv-wait.2' $wheel
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  IRFeedback-2026.10.30-csv-wait.2.zip" | Set-Content -Encoding utf8 "$out\SHA256.txt"
          @{ source_commit = $env:GITHUB_SHA; zip_sha256 = $hash; version = '2026.10.30-csv-wait.2'; pillow_sha256 = (Get-FileHash $wheel -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content -Encoding utf8 "$out\candidate.json"
          Expand-Archive $zip "$env:RUNNER_TEMP\slice-extracted"
      - name: Test packaged runtime and application
        id: tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:RUNNER_TEMP\slice-extracted\app"
          $python = "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe"
          $deps = "$env:RUNNER_TEMP\slice-test-deps"
          # Unpack pinned test-only wheels in TEMP; do not install into the runtime.
          @'
          import hashlib, io, sys, urllib.request, zipfile
          from pathlib import Path
          dest=Path(sys.argv[1]); dest.mkdir(exist_ok=True)
          wheels=[
            ('https://files.pythonhosted.org/packages/c0/da/977ded879c29cbd04de313843e76868e6e13408a94ed6b987245dc7c8506/openpyxl-3.1.5-py2.py3-none-any.whl','5282c12b107bffeef825f4617dc029afaf41d0ea60823bbb665ef3079dc79de2'),
            ('https://files.pythonhosted.org/packages/c1/8b/5fe2cc11fee489817272089c4203e679c63b570a5aaeb18d852ae3cbba6a/et_xmlfile-2.0.0-py3-none-any.whl','7a91720bc756843502c3b7504c77b8fe44217c85c537d85037f0f536151b2caa')]
          for url,expected in wheels:
              with urllib.request.urlopen(url,timeout=30) as response: data=response.read()
              assert hashlib.sha256(data).hexdigest()==expected
              with zipfile.ZipFile(io.BytesIO(data)) as archive: archive.extractall(dest)
          '@ | python - $deps
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test wheels could not be unpacked' }
          Copy-Item app/test_*.py $app
          Copy-Item app/input_example_validation.json,app/random80_validation.json $app
          $env:PYTHONPATH = $deps
          & $python -c "import sys, PIL, PIL._imaging, tkinter; print(sys.version); print(PIL.__file__); print(PIL._imaging.__file__); assert sys.version_info[:3] == (3,14,5); assert 'slice-extracted' in PIL.__file__.lower()"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime import failed' }
          $errors = $null; $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$app\excel_worker.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw "PowerShell parse errors: $errors" }
          Push-Location $app
          try {
            & $python -m unittest discover -v 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\tests.txt"
            if ($LASTEXITCODE -ne 0) { throw 'Application tests failed' }
          } finally { Pop-Location }
      - name: Exercise launcher
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python release_tools/windows_smoke.py "$env:RUNNER_TEMP\slice-extracted" 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\smoke.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher smoke failed' }
      - name: Verify bridge loading with downloaded-file marking
        id: bridge
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_bridge_probe.py "$env:RUNNER_TEMP\slice-extracted" "$env:RUNNER_TEMP\slice-candidate\bridge.json"
          if ($LASTEXITCODE -ne 0) { throw 'Marked DLL production discovery/initialization probe failed' }
      - name: Verify S3 large native inventory and closed-failure cases
        id: native_discovery
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = "$env:RUNNER_TEMP\old-UiaBridge.dll"
          $archive = [IO.Compression.ZipFile]::OpenRead("$env:GITHUB_WORKSPACE\dist\IRFeedback-2026.10.27-csv.6.zip")
          try {
            $input = $archive.GetEntry('app/UiaBridge.dll').Open()
            $output = [IO.File]::Create($old)
            try { $input.CopyTo($output) } finally { $output.Dispose(); $input.Dispose() }
          } finally { $archive.Dispose() }
          if ((Get-FileHash $old -Algorithm SHA256).Hash -ne '7D0D94474A500D0CBFA5725B9E1E385682B32266AC2E862D09048F8DE98F4A72') { throw 'Old bridge reference mismatch' }
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_discovery_probe.py "$env:RUNNER_TEMP\slice-extracted" "$env:RUNNER_TEMP\slice-candidate\discovery.json" $old 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\discovery.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Large native inventory regression failed' }
      - name: Verify actual native CSV content guard
        id: csv_guard
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File release_tools/windows_csv_guard_probe.ps1 -PackageRoot "$env:RUNNER_TEMP\slice-extracted" -ResultPath "$env:RUNNER_TEMP\slice-candidate\csv-guard.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native CSV content guard probe failed' }
      - name: Verify connected settings recovery without navigation or Save
        id: settings_recovery
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_settings_recovery_probe.py "$env:RUNNER_TEMP\slice-extracted" "$env:RUNNER_TEMP\slice-candidate\settings-recovery.json" 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\settings-recovery.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Connected settings recovery native probe failed' }
      - name: Crosscheck slice analysis parity and performance
        id: slice_perf
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_slice_analysis_probe.py "$env:RUNNER_TEMP\slice-extracted" "$env:RUNNER_TEMP\slice-candidate\slice-performance.json" 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\slice-performance.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Slice analysis parity/performance check failed' }
      - name: Verify bound Home image source and content guards
        id: auto_slice
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_auto_slice_probe.py "$env:RUNNER_TEMP\slice-extracted" "$env:RUNNER_TEMP\slice-candidate\auto-slice.json" 2>&1 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\slice-candidate\auto-slice.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Bound Home auto image source check failed' }
      - name: Exercise Excel COM
        id: excel
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:RUNNER_TEMP\slice-extracted\app;$env:RUNNER_TEMP\slice-test-deps"
          & "$env:RUNNER_TEMP\slice-extracted\runtime\python.exe" release_tools/windows_excel_probe.py "$env:RUNNER_TEMP\slice-candidate\excel.json"
          if ($LASTEXITCODE -ne 0) { throw 'Excel COM validation unavailable or failed; release gate closed' }
      - name: Reverify original candidate
        id: reverify
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\slice-candidate\IRFeedback-2026.10.30-csv-wait.2.zip"
          python release_tools/verify_package.py $zip '2026.10.30-csv-wait.2'
          if ($LASTEXITCODE -ne 0) { throw 'Package verification failed' }
          $record = Get-Content "$env:RUNNER_TEMP\slice-candidate\candidate.json" -Raw | ConvertFrom-Json
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $record.zip_sha256) { throw 'Candidate ZIP changed during validation' }
      - name: Record validation status
        if: always()
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\slice-candidate"
          New-Item -ItemType Directory -Force $out | Out-Null
          $checks = [ordered]@{ build = '${{ steps.build.outcome }}'; tests = '${{ steps.tests.outcome }}'; smoke = '${{ steps.smoke.outcome }}'; bridge = '${{ steps.bridge.outcome }}'; csv_guard = '${{ steps.csv_guard.outcome }}'; native_discovery = '${{ steps.native_discovery.outcome }}'; slice_perf = '${{ steps.slice_perf.outcome }}'; settings_recovery = '${{ steps.settings_recovery.outcome }}'; auto_slice = '${{ steps.auto_slice.outcome }}'; excel = '${{ steps.excel.outcome }}'; reverify = '${{ steps.reverify.outcome }}' }
          $passed = @($checks.Values | Where-Object { $_ -ne 'success' }).Count -eq 0
          @{ source_commit = $env:GITHUB_SHA; checks = $checks; automated_checks_passed = $passed; final_sol_review = 'pending'; release_ready = $false; device_application_approved = $false } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$out\readiness.json"
      - name: Upload candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slice-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/slice-candidate/
          if-no-files-found: warn
      - name: Enforce release readiness
        if: always()
        shell: pwsh
        run: |
          $outcomes = @('${{ steps.build.outcome }}','${{ steps.tests.outcome }}','${{ steps.smoke.outcome }}','${{ steps.bridge.outcome }}','${{ steps.csv_guard.outcome }}','${{ steps.native_discovery.outcome }}','${{ steps.slice_perf.outcome }}','${{ steps.settings_recovery.outcome }}','${{ steps.auto_slice.outcome }}','${{ steps.excel.outcome }}','${{ steps.reverify.outcome }}')
          if (@($outcomes | Where-Object { $_ -ne 'success' }).Count) { throw "Candidate validation incomplete or failed; release gate closed: $outcomes" }
