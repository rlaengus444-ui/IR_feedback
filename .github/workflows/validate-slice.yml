name: Compile S3 discovery bridge for review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-bridge:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - name: Preserve checkout bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Compile reviewed bridge sources in temporary copy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:RUNNER_TEMP\native-bridge"
          New-Item -ItemType Directory -Force "$out\app" | Out-Null
          Copy-Item app/UiaBridge*.cs,app/build_uia_bridge.ps1 "$out\app"
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$out\app\build_uia_bridge.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'Bridge compilation failed' }
          $sources = [ordered]@{}
          Get-ChildItem app/UiaBridge*.cs,app/build_uia_bridge.ps1 | ForEach-Object { $sources[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          $binary = Get-Item "$out\app\UiaBridge.dll"
          @{ source_commit=$env:GITHUB_SHA; source_sha256=$sources; bridge_sha256=(Get-FileHash $binary.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); bridge_bytes=$binary.Length; equipment_actions=0 } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "$out\compile.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-bridge-${{ github.sha }}
          path: ${{ runner.temp }}/native-bridge/
          if-no-files-found: error
